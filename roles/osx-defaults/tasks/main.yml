---

- name: Setup General
  osx_defaults:
    domain: '{{ item.domain }}'
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  with_items: '{{ setup_general }}'
  tags: [osx-defaults, setup-general]

- name: Setup Finder
  osx_defaults:
    domain: '{{ item.domain }}'
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  with_items: '{{ setup_finder }}'
  tags: [osx-defaults, setup-finder]
  notify: killall Finder

- name: Setup Dock
  osx_defaults:
    domain: '{{ item.domain }}'
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  with_items: '{{ setup_dock }}'
  tags: [osx-defaults, setup-dock]
  notify: killall Dock

- name: Setup SystemUIServer
  osx_defaults:
    domain: '{{ item.domain }}'
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  with_items: '{{ setup_systemuiserver }}'
  tags: [osx-defaults, setup-systemuiserver]
  notify: killall SystemUIServer

- name: Setup Other
  osx_defaults:
    domain: '{{ item.domain }}'
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  with_items: '{{ setup_other }}'
  tags: [osx-defaults, setup-other]
